# Copy to profile.yaml and fill in. Gitignored, like resume.txt.
#
# These are the FACTS the drafter is allowed to state about you. It maps employer
# questions onto this file — it never invents an answer. Anything not covered here
# comes back blank and flagged for you to fill in, which is the point: a gap must
# surface rather than get filled with a plausible guess.

name: Your Name
email: you@example.com
phone: "+63 900 000 0000"
location: Quezon City, Philippines
portfolio: https://yourdomain.dev
github: https://github.com/yourhandle
linkedin: https://linkedin.com/in/yourhandle

# Education. Be accurate — this answers "do you have a degree" questions.
education:
  highest: none          # none | some_college | vocational | associate | bachelor | master
  completed: false
  field: ""
  school: ""
  graduated_year: null

experience:
  years_total: 5
  # Answers "how many years' experience do you have as an X", which is a required
  # dropdown on Jobstreet and Indeed. A ROLE is not a SKILL: this asks how long the
  # work was the job, not how long the tool has been in hand, so these are usually
  # smaller than years_by_skill. Leave a role out rather than estimating it - the
  # answer then comes back blank and flagged, which is recoverable, and an inflated
  # year count is what an interviewer opens with.
  years_by_role:
    full stack developer: 5
    backend developer: 4
    automation engineer: 2

  # Used for "how many years of X" dropdowns. Only list what you would defend
  # in an interview.
  years_by_skill:
    javascript: 5
    typescript: 4
    react: 5
    node: 5
    python: 4
    postgresql: 4
    docker: 3

# Commitments, not facts — these are decisions, so state them yourself.
compensation:
  expected_monthly_php: 80000
  expected_range_php: [70000, 90000]
  negotiable: true
availability:
  notice_period_days: 0
  earliest_start: "immediately"
work_setup: [remote, hybrid]      # remote | hybrid | onsite
onsite_ok_locations: []           # e.g. [Makati, BGC] — empty means remote/hybrid only
willing_to_relocate: false
work_authorization: "Philippine citizen, no sponsorship required"

# Optional. Free-text notes the drafter may use for context, e.g. why you are
# looking, or domains you want. Keep it short and true.
notes: ""
